<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Stack Career Tracks | AutoStack AI</title>
    <meta name="description" content="6-month, mentor-led career tracks in Web Development, AI Development and Agentic AI. Online or in person. Message us on WhatsApp.">
    <meta name="theme-color" content="#06051A">
    <style>
      html {
        -webkit-text-size-adjust: 100%
      }

      body {
        margin: 0
      }

      img {
        max-width: 100%
      }

      [hidden] {
        display: none !important
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
    <style>
      /* Layout: centered hero (matches stackpk.com) with a facts bar; tracks as a 3-up grid; each track opens its own hash-routed page with a sticky WhatsApp rail. */
      :root {
        /* Brand look from stackpk.com: deep violet into midnight, lavender accent, white pill buttons. Single dark theme by choice. */
        --bg: #06051A;
        --surface: #110D2B;
        --surface-2: #18123A;
        --ink: #F4F1FF;
        --muted: #A8A2C8;
        --line: #2A2352;
        --accent: #9B7BF0;
        --accent-2: #C4B2FA;
        --accent-ink: #0B0920;
        --violet-deep: #2B0E63;
        --btn: #F4F1FF;
        --btn-ink: #0B0920;
        --wa: #25D366;
        --mark: #9B7BF0;
        --web: #8EA2FF;
        --ai: #B794FF;
        --agent: #E58CFF;
        --display: "Space Grotesk", "Avenir Next", "Segoe UI", system-ui, sans-serif;
        --body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 20px 50px -20px rgba(43, 14, 99, .8);
        color-scheme: dark;
      }

      * {
        box-sizing: border-box
      }

      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--body);
        font-size: 16px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 60;
        background: var(--bg)
      }

      a {
        color: inherit
      }

      h1,
      h2,
      h3 {
        font-family: var(--display);
        line-height: 1.05;
        letter-spacing: -.02em;
        text-wrap: balance;
        margin: 0
      }

      p {
        margin: 0
      }

      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding-left: max(20px, env(safe-area-inset-left, 0px));
        padding-right: max(20px, env(safe-area-inset-right, 0px))
      }

      .eyebrow {
        font-family: var(--display);
        font-weight: 600;
        font-size: 12px;
        letter-spacing: .22em;
        text-transform: uppercase;
        color: var(--muted)
      }

      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
        border-radius: 8px
      }

      /* Nav */
      .nav {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 50;
        background: color-mix(in srgb, var(--bg) 86%, transparent);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--line)
      }

      .nav .wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-block: 14px
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--display);
        font-weight: 800;
        font-size: 20px;
        text-decoration: none;
        letter-spacing: -.02em
      }

      .logo img {
        display: block;
        height: 36px;
        width: auto
      }

      @media (max-width:560px) {
        .logo img {
          height: 30px
        }
      }

      .logo-mark {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: linear-gradient(135deg, var(--accent-2), var(--accent));
        color: var(--accent-ink);
        display: grid;
        place-items: center;
        font-family: var(--mono);
        font-size: 13px
      }

      .nav-links {
        display: flex;
        gap: 28px;
        align-items: center
      }

      .nav-links a {
        text-decoration: none;
        color: var(--muted);
        font-weight: 600;
        font-size: 15px
      }

      .nav-links a:hover {
        color: var(--ink)
      }

      .nav-links a.btn,
      .nav-links a.btn:hover {
        color: var(--btn-ink);
        white-space: nowrap
      }

      @media (max-width:760px) {
        .nav-links a.btn {
          display: none
        }
      }

      @media (max-width:760px) {
        .nav-links a:not(.btn) {
          display: none
        }
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 0;
        border-radius: 999px;
        padding: 14px 22px;
        font: 700 16px/1 var(--body);
        text-decoration: none;
        cursor: pointer;
        transition: transform .15s ease, box-shadow .15s ease, background .15s
      }

      .btn:hover {
        transform: translateY(-1px)
      }

      .btn-wa {
        background: var(--btn);
        color: var(--btn-ink);
        box-shadow: 0 10px 30px -12px color-mix(in srgb, var(--accent) 80%, transparent)
      }

      .btn-wa svg {
        color: #128C4A
      }

      .btn-wa:hover {
        box-shadow: 0 14px 36px -10px color-mix(in srgb, var(--accent) 90%, transparent)
      }

      .btn-ghost {
        background: transparent;
        color: var(--ink);
        border: 1.5px solid var(--line)
      }

      .btn-ghost:hover {
        border-color: var(--accent-2)
      }

      .btn-sm {
        padding: 10px 16px;
        font-size: 14px
      }

      .btn svg {
        width: 20px;
        height: 20px;
        flex: none
      }

      /* Hero */
      .hero {
        padding-block: 96px 80px;
        text-align: center;
        background: radial-gradient(90% 80% at 50% 0%, var(--violet-deep) 0%, transparent 70%), linear-gradient(180deg, color-mix(in srgb, var(--violet-deep) 45%, var(--bg)) 0%, var(--bg) 100%)
      }

      .hero .wrap {
        display: flex;
        flex-direction: column;
        align-items: center
      }

      .pill {
        display: inline-flex;
        padding: 8px 18px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: color-mix(in srgb, var(--surface) 60%, transparent)
      }

      .hero h1 {
        margin-top: 26px;
        font-size: clamp(40px, 5.6vw, 76px);
        font-weight: 800;
        letter-spacing: -.035em
      }

      .hero h1 .hl {
        white-space: nowrap;
        background: linear-gradient(90deg, var(--accent-2), var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent
      }

      /* removed marker */
      .hero h1 .hl-unused::after {
        content: "";
        position: absolute;
        left: -.06em;
        right: -.06em;
        bottom: .08em;
        height: .32em;
        background: var(--mark);
        z-index: -1;
        border-radius: 4px;
        transform: skewX(-8deg);
        transform-origin: left;
        animation: mark .7s .25s cubic-bezier(.2, .8, .2, 1) both
      }

      @keyframes mark {
        from {
          transform: skewX(-8deg) scaleX(0)
        }

        to {
          transform: skewX(-8deg) scaleX(1)
        }
      }

      .hero-sub {
        margin-top: 24px;
        font-size: clamp(17px, 1.8vw, 20px);
        color: var(--muted);
        max-width: 46ch
      }

      .hero-ctas {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 34px
      }

      .hero .hero-ctas {
        justify-content: center
      }

      .hero-meta {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        width: 100%;
        max-width: 860px;
        margin-top: 56px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: color-mix(in srgb, var(--surface) 70%, transparent);
        overflow: hidden
      }

      .hero-meta div {
        padding: 18px 16px;
        display: grid;
        gap: 2px;
        justify-items: center
      }

      .hero-meta div+div {
        border-left: 1px solid var(--line)
      }

      .hero-meta strong {
        font-family: var(--display);
        font-size: 18px
      }

      .hero-meta span {
        display: block;
        font-size: 13px;
        color: var(--muted)
      }

      @media (max-width:760px) {
        .hero-meta {
          grid-template-columns: repeat(2, minmax(0, 1fr))
        }

        .hero-meta div:nth-child(3) {
          border-left: 0
        }

        .hero-meta div:nth-child(n+3) {
          border-top: 1px solid var(--line)
        }
      }

      .board {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 10px;
        min-width: 0
      }

      .board-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 14px 10px
      }

      .board-row {
        display: grid;
        grid-template-columns: 44px 1fr auto;
        gap: 14px;
        align-items: center;
        padding: 14px;
        border-radius: 14px;
        text-decoration: none;
        transition: background .15s
      }

      .board-row:hover {
        background: color-mix(in srgb, var(--c) 9%, transparent)
      }

      .board-row+.board-row {
        border-top: 1px dashed var(--line)
      }

      .board-row strong {
        display: block;
        font-family: var(--display);
        font-size: 19px;
        letter-spacing: -.01em
      }

      .board-row small {
        color: var(--muted);
        font-size: 13.5px
      }

      .chip {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: color-mix(in srgb, var(--c) 14%, transparent);
        color: var(--c)
      }

      .chip svg {
        width: 22px;
        height: 22px
      }

      .dur {
        font-family: var(--mono);
        font-size: 12.5px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--line);
        white-space: nowrap;
        font-variant-numeric: tabular-nums
      }

      @media (max-width:760px) {
        .hero {
          padding-block: 56px 48px
        }
      }

      /* Sections */
      section {
        padding-block: 72px;
        scroll-margin-top: 72px
      }

      .sec-head {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 24px;
        flex-wrap: wrap;
        margin-bottom: 36px
      }

      .sec-head h2 {
        font-size: clamp(32px, 4.4vw, 52px);
        font-weight: 800
      }

      .sec-head p {
        color: var(--muted);
        max-width: 44ch
      }

      .tracks {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px
      }

      @media (max-width:980px) {
        .tracks {
          grid-template-columns: 1fr
        }
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 18px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 28px;
        text-decoration: none;
        overflow: hidden;
        transition: transform .2s ease, box-shadow .2s ease, border-color .2s
      }

      .card:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow);
        border-color: color-mix(in srgb, var(--c) 45%, var(--line))
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px
      }

      .card h3 {
        font-size: clamp(26px, 2.6vw, 32px);
        font-weight: 800
      }

      .card p {
        color: var(--muted)
      }

      .card .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px
      }

      .tag {
        font-size: 13px;
        font-weight: 600;
        padding: 5px 11px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--c) 16%, transparent);
        color: var(--ink)
      }

      .card .more {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        color: var(--c)
      }

      .card .more span {
        transition: transform .2s
      }

      .card:hover .more span {
        transform: translateX(4px)
      }

      .card-glyph {
        position: absolute;
        right: -12px;
        bottom: -26px;
        font-family: var(--mono);
        font-size: 120px;
        line-height: 1;
        color: color-mix(in srgb, var(--c) 9%, transparent);
        pointer-events: none;
        user-select: none
      }

      .steps {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
        counter-reset: s
      }

      @media (max-width:760px) {
        .steps {
          grid-template-columns: 1fr
        }
      }

      .step {
        padding: 26px;
        border-top: 2px solid var(--accent)
      }

      .step b {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--muted);
        display: block;
        margin-bottom: 14px
      }

      .step h3 {
        font-size: 24px;
        margin-bottom: 8px
      }

      .step p {
        color: var(--muted)
      }

      .faq {
        display: grid;
        gap: 10px;
        max-width: 820px
      }

      details {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 0 22px
      }

      summary {
        cursor: pointer;
        list-style: none;
        padding: 20px 0;
        font-weight: 700;
        font-size: 17px;
        display: flex;
        justify-content: space-between;
        gap: 16px
      }

      summary::-webkit-details-marker {
        display: none
      }

      summary::after {
        content: "+";
        font-family: var(--mono);
        color: var(--muted);
        transition: transform .2s
      }

      details[open] summary::after {
        transform: rotate(45deg)
      }

      details p {
        color: var(--muted);
        padding-bottom: 20px;
        max-width: 65ch
      }

      .final {
        background: radial-gradient(100% 140% at 100% 0%, var(--violet-deep), var(--surface) 70%);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: clamp(36px, 6vw, 72px);
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 32px;
        align-items: center
      }

      .final h2 {
        font-size: clamp(32px, 4.6vw, 56px);
        font-weight: 800
      }

      .final p {
        opacity: .75;
        margin-top: 14px;
        max-width: 46ch
      }

      @media (max-width:760px) {
        .final {
          grid-template-columns: 1fr
        }
      }

      footer {
        padding-block: 40px 110px;
        color: var(--muted);
        font-size: 14px
      }

      footer .wrap {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap
      }

      /* Track detail page */
      .detail-hero {
        padding-block: 44px 40px;
        border-bottom: 1px solid var(--line);
        background: radial-gradient(120% 100% at 0% 0%, var(--violet-deep) 0%, transparent 65%), linear-gradient(180deg, color-mix(in srgb, var(--c) 10%, var(--bg)) 0%, var(--bg) 100%)
      }

      .back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        color: var(--muted);
        text-decoration: none;
        margin-bottom: 28px
      }

      .back:hover {
        color: var(--ink)
      }

      .detail-hero h1 {
        font-size: clamp(42px, 6.4vw, 80px);
        font-weight: 800;
        letter-spacing: -.035em
      }

      .detail-hero .lede {
        font-size: clamp(18px, 2vw, 21px);
        color: var(--muted);
        margin-top: 18px;
        max-width: 52ch
      }

      .facts {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1px;
        background: var(--line);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        margin-top: 36px
      }

      .fact {
        background: var(--surface);
        padding: 18px 20px
      }

      .fact .eyebrow {
        font-size: 11px
      }

      .fact strong {
        display: block;
        font-family: var(--display);
        font-size: 22px;
        margin-top: 4px;
        letter-spacing: -.01em
      }

      @media (max-width:760px) {
        .facts {
          grid-template-columns: repeat(2, minmax(0, 1fr))
        }

        .fact strong {
          font-size: 18px
        }
      }

      .detail-body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 48px;
        padding-block: 56px
      }

      @media (max-width:960px) {
        .detail-body {
          grid-template-columns: 1fr
        }
      }

      .detail-body h2 {
        font-size: clamp(26px, 3vw, 34px);
        font-weight: 800;
        margin-bottom: 22px
      }

      .block+.block {
        margin-top: 56px
      }

      .outline {
        list-style: none;
        margin: 0;
        padding: 0;
        border-left: 2px solid var(--line)
      }

      .outline li {
        position: relative;
        padding: 0 0 26px 28px
      }

      .outline li::before {
        content: "";
        position: absolute;
        left: -7px;
        top: 6px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--bg);
        border: 2px solid var(--c)
      }

      .outline .wk {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--c);
        font-weight: 500;
        letter-spacing: .04em
      }

      .outline h3 {
        font-size: 21px;
        margin: 2px 0 6px;
        letter-spacing: -.01em
      }

      .outline p {
        color: var(--muted)
      }

      .topics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px
      }

      @media (max-width:560px) {
        .topics {
          grid-template-columns: 1fr
        }
      }

      .topic {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface)
      }

      .topic svg {
        flex: none;
        width: 20px;
        height: 20px;
        color: var(--c);
        margin-top: 2px
      }

      .topic span {
        font-weight: 600
      }

      .outcomes {
        display: grid;
        gap: 12px
      }

      .outcome {
        padding: 18px 20px;
        border-radius: 14px;
        background: color-mix(in srgb, var(--c) 8%, var(--surface));
        border: 1px solid color-mix(in srgb, var(--c) 20%, var(--line))
      }

      .outcome strong {
        font-family: var(--display);
        font-size: 18px;
        display: block
      }

      .outcome span {
        color: var(--muted);
        font-size: 15px
      }

      .rail {
        position: sticky;
        top: calc(env(safe-area-inset-top, 0px) + 84px);
        align-self: start;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 26px;
        box-shadow: var(--shadow);
        display: grid;
        gap: 16px
      }

      .rail h3 {
        font-size: 24px
      }

      .rail p {
        color: var(--muted);
        font-size: 15px
      }

      .rail ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 10px;
        font-size: 15px
      }

      .rail li {
        display: flex;
        gap: 10px
      }

      .rail li::before {
        content: "✓";
        color: var(--accent-2);
        font-weight: 800
      }

      .rail .btn {
        width: 100%
      }

      .rail small {
        color: var(--muted);
        font-size: 13px;
        text-align: center
      }

      @media (max-width:960px) {
        .rail {
          position: static
        }
      }

      .others {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px
      }

      @media (max-width:760px) {
        .others {
          grid-template-columns: 1fr
        }
      }

      .other {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        text-decoration: none;
        transition: border-color .2s
      }

      .other:hover {
        border-color: var(--c)
      }

      .other strong {
        font-family: var(--display);
        font-size: 17px;
        display: block
      }

      .other small {
        color: var(--muted)
      }

      /* Floating WhatsApp (mobile) */
      .fab {
        position: fixed;
        z-index: 40;
        left: max(16px, env(safe-area-inset-left, 0px));
        right: max(16px, env(safe-area-inset-right, 0px));
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        display: none
      }

      .fab .btn {
        width: 100%;
        padding: 16px
      }

      @media (max-width:760px) {
        .fab {
          display: block
        }
      }

      .view {
        animation: fade .35s ease both
      }

      @keyframes fade {

        return `<a class="btn btn-wa ${extra}" href="${waLink(track)}" target="_blank" rel="noopener">${WA_ICON}${esc(label)}</a>`;
      }
      const cvar = t => `--c:var(${t.color})`;

      /* ===== views ===== */
      function home() {
        return `<div class="view">
  <section class="hero" id="top">
    <div class="wrap">
      <div>
        <p class="eyebrow pill">Web · AI · Agentic AI</p>
        <h1>Stop watching tutorials.<br>Start building <span class="hl">skills that pay.</span></h1>
        <p class="hero-sub">Mentor-led career tracks where you build real projects, grow a portfolio, and get ready for jobs and freelance clients.</p>
        <div class="hero-ctas">
          ${waBtn("Get free career advice", null)}
          <a class="btn btn-ghost" href="#tracks">Explore the tracks</a>
        </div>
        <div class="hero-meta">
          <div><strong>6 months</strong><span>per track</span></div>
          <div><strong>Mentor-led</strong><span>real projects</span></div>
          <div><strong>Online</strong><span>or in person</span></div>
          <div><strong>Certificate</strong><span>on completion</span></div>
        </div>
      </div>
    </div>
  </section>

  <section id="tracks" style="padding-top:24px">
    <div class="wrap">
      <div class="sec-head">
        <h2>Three tracks.<br>One goal: get you hired.</h2>
        <p>Each track is a 6-month structured path with monthly milestones, hands-on projects, and a capstone you can show employers and clients.</p>
      </div>
      <div class="tracks">
        ${TRACKS.map(t => `
          <a class="card" href="#${t.id}" style="${cvar(t)}">
            <span class="card-glyph" aria-hidden="true">${esc(t.glyph)}</span>
            <div class="card-top"><span class="chip">${ICONS[t.key]}</span><span class="dur">${esc(t.duration)}</span></div>
            <h3>${esc(t.name)}</h3>
            <p>${esc(t.short)}</p>
            <div class="tags">${t.tags.map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div>
            <span class="more">See the full outline <span>→</span></span>
          </a>`).join("")}
      </div>
    </div>
  </section>

  <section id="how">
    <div class="wrap">
      <div class="sec-head"><h2>How to get started</h2></div>
      <div class="steps">
        ${STEPS.map((s, i) => `<div class="step"><b>Step ${i + 1}</b><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join("")}
      </div>
    </div>
  </section>

  <section id="faq">
    <div class="wrap">
      <div class="sec-head"><h2>Questions</h2></div>
      <div class="faq">
        ${FAQ.map(f => `<details><summary>${esc(f[0])}</summary><p>${esc(f[1])}</p></details>`).join("")}
      </div>
    </div>
  </section>

  <section style="padding-top:24px">
    <div class="wrap">
      <div class="final">
        <div>
          <h2>Your next skill is one message away.</h2>
          <p>Tell us where you are today and where you want to be. We'll point you to the right track.</p>
        </div>
        ${waBtn("Message us on WhatsApp", null)}
      </div>
    </div>
  </section>
  </div>`;
      }

      function detail(t) {
        const others = TRACKS.filter(x => x !== t);
        return `<div class="view" style="${cvar(t)}">
  <section class="detail-hero">
    <div class="wrap">
      <a class="back" href="#tracks">← All tracks</a>
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px">
        <span class="chip">${ICONS[t.key]}</span><span class="eyebrow">Career track</span>
      </div>
      <h1>${esc(t.name)}</h1>
      <p class="lede">${esc(t.lede)}</p>
      <div class="hero-ctas">${waBtn("Ask about this track", t)}</div>
      <div class="facts">
        <div class="fact"><span class="eyebrow">Duration</span><strong>${esc(t.duration)}</strong></div>
        <div class="fact"><span class="eyebrow">Time</span><strong>${esc(t.hours)}</strong></div>
        <div class="fact"><span class="eyebrow">Level</span><strong>${esc(t.level)}</strong></div>
        <div class="fact"><span class="eyebrow">Format</span><strong>${esc(t.mode)}</strong></div>
      </div>
    </div>
  </section>

  <div class="wrap">
    <div class="detail-body">
      <div style="min-width:0">
        <div class="block">
          <h2>Course outline</h2>
          <ol class="outline">
            ${t.outline.map(o => `<li><span class="wk">${esc(o[0])}</span><h3>${esc(o[1])}</h3><p>${esc(o[2])}</p></li>`).join("")}
          </ol>
        </div>
        <div class="block">
          <h2>What you'll learn</h2>
          <div class="topics">${t.topics.map(x => `<div class="topic">${CHECK}<span>${esc(x)}</span></div>`).join("")}</div>
        </div>
        <div class="block">
          <h2>Where you'll be at the end</h2>
          <div class="outcomes">${t.outcomes.map(o => `<div class="outcome"><strong>${esc(o[0])}</strong><span>${esc(o[1])}</span></div>`).join("")}</div>
        </div>
      </div>
      <aside class="rail">
        <span class="eyebrow">Next batch</span>
        <h3>Ready to start ${esc(t.name)}?</h3>
        <p>Message us on WhatsApp for batch dates and a free consultation.</p>
        <ul>
          <li>${esc(t.duration)} structured program</li>
          <li>Hands-on projects every module</li>
          <li>Capstone + certificate</li>
        </ul>
        ${waBtn("Chat on WhatsApp", t)}
        <small>We usually reply within a few hours.</small>
      </aside>
    </div>

    <section style="padding-top:0">
      <h2 style="font-size:28px;margin-bottom:18px">Explore other tracks</h2>
      <div class="others">
        ${others.map(o => `<a class="other" href="#${o.id}" style="${cvar(o)}"><span class="chip">${ICONS[o.key]}</span><span><strong>${esc(o.name)}</strong><small>${esc(o.duration)}</small></span></a>`).join("")}
      </div>
    </section>
  </div>
  </div>`;
      }

      /* ===== router ===== */
      const SECTIONS = ["top", "tracks", "how", "faq"];
      function setWa(track) {
        document.querySelectorAll('[data-wa]').forEach(a => {
          a.href = waLink(track); a.target = "_blank"; a.rel = "noopener";
          if (!a.querySelector("svg")) a.insertAdjacentHTML("afterbegin", WA_ICON);
        });
      }
      let current = null;
      function route() {
        const h = location.hash.replace("#", "");
        const t = TRACKS.find(x => x.id === h);
        if (t) {
          if (current !== t.id) { $app.innerHTML = detail(t); current = t.id; }
          window.scrollTo({ top: 0 });
          document.title = `${t.name} · Career Tracks`;
          setWa(t);
          return;
        }
        if (current !== "home") { $app.innerHTML = home(); current = "home"; }
        document.title = "Stack Career Tracks | AutoStack AI";
        setWa(null);
        const target = SECTIONS.includes(h) && h !== "top" ? document.getElementById(h) : null;
        if (target) target.scrollIntoView(); else if (h === "top" || !h) window.scrollTo({ top: 0 });
      }
      window.addEventListener("hashchange", route);
      // Handle in-page links ourselves (capture phase), so a host's smooth-scroll or router script can't swallow them.
      window.addEventListener("click", e => {
        const a = e.target.closest && e.target.closest('a[href^="#"]');
        if (!a) return;
        const id = a.getAttribute("href").slice(1);
        if (!TRACKS.some(t => t.id === id) && !SECTIONS.includes(id)) return;
        e.preventDefault();
        if (location.hash !== "#" + id) location.hash = id;
        route();
      }, true);
      route();
    </script>
  </body>

</html>
